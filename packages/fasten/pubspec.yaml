name: frankstein_fasten
description: >-
  Fasten Health — prontuário pessoal (PHR/FHIR), papel opcional e federado
  (ADR-4 aceita, docs/LICENSE-AUDIT.md Cenário B). O Frankstein nunca linka o
  código do Fasten (GPL-3.0, continua GPL-3.0 como programa separado) — só
  conversa com a API FHIR dele, sob ação explícita do usuário.
  sync_fasten_records registrada no ToolRegistry.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  frankstein_health_core:
    path: ../health_core
  frankstein_tool_registry:
    path: ../tool_registry

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
