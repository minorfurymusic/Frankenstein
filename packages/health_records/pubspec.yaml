name: frankstein_health_records
description: >-
  Aba Saúde — remédios (catálogo + agenda + doses), sintomas, sinais vitais e medidas
  corporais, gravados no Health Data Core. Unidades em SI no banco
  (.claude/rules/00-inviolaveis.md); conversão para unidade clínica só na exibição.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  frankstein_health_core:
    path: ../health_core
  frankstein_tool_registry:
    path: ../tool_registry
  sqlite3: ^2.4.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
