name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"

      # Runners ubuntu-latest já vêm com Android SDK/build-tools instalados
      # — diferente do sandbox de desenvolvimento usado no Ciclo 1 da
      # Fase 2, onde dl.google.com é bloqueado pela política de rede do
      # ambiente. Se este passo falhar por SDK ausente, o runner mudou;
      # não assuma, confira a saída.
      - name: flutter doctor
        run: flutter doctor -v

      # Achado real do primeiro run desta CI (Ciclo 27): o SDK está
      # presente, mas as licenças não estão aceitas por padrão — sem
      # isso, `flutter build apk` falha mesmo com o SDK instalado.
      - name: aceitar licenças do Android SDK
        run: yes | flutter doctor --android-licenses || true

      - name: lint
        run: make lint

      - name: test
        run: make test

      # ADR-28: chave fixa dos APKs de teste, guardada nos segredos do
      # repositório (RLT_KEYSTORE_BASE64 e RLT_KEYSTORE_PASSWORD). Sem os
      # segredos, o build segue com a chave debug padrão, que muda a cada run.
      - name: chave de assinatura de teste
        env:
          RLT_KEYSTORE_BASE64: ${{ secrets.RLT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RLT_KEYSTORE_BASE64" ]; then
            echo "$RLT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rlt-teste.p12"
            echo "RLT_KEYSTORE_PATH=$RUNNER_TEMP/rlt-teste.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo RLT_KEYSTORE_BASE64 ausente: APK assinado com a chave debug padrão (muda a cada run)."
          fi

      - name: build
        env:
          RLT_KEYSTORE_PASSWORD: ${{ secrets.RLT_KEYSTORE_PASSWORD }}
        run: make build

      # APK debug (assinado com a chave debug padrão do Flutter — só serve
      # pra instalar direto no aparelho pra teste, não é canal de
      # distribuição real; ADR-7 continua em aberto quanto a isso) exposto
      # como artifact do run, pra baixar sem precisar de ambiente com SDK
      # Android — o sandbox de dev deste projeto não tem um
      # (dl.google.com bloqueado pela política de rede).
      - name: publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: frankstein-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
